name: Compile Kernel CI

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в интерфейсе GitHub

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev curl zip unzip

      - name: Download Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Setup KernelSU Next
        run: |
          echo "Скачиваем KernelSU Next..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
          echo "Фиксы для старых ядер..."
          sed -i '1s/^/#include <linux\/err.h>\n/' drivers/kernelsu/hook/setuid_hook.c
          sed -i 's/in_compat_syscall()/is_compat_task()/g' drivers/kernelsu/sulog/event.c
          sed -i '1s/^/#include <linux\/compat.h>\n/' drivers/kernelsu/sulog/event.c
          sed -i '1i #ifndef ALIGN_DOWN\n#define ALIGN_DOWN(x, a) ((x) & ~((typeof(x))(a) - 1))\n#endif\n' drivers/kernelsu/feature/adb_root.c
          sed -i '1i #ifndef __nocfi\n#define __nocfi\n#endif\n' drivers/kernelsu/feature/selinux_hide.c
          
          echo "Включаем KernelSU и принудительные ручные хуки..."
          echo "CONFIG_KSU=y" >> arch/arm64/configs/lavender-perf_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/lavender-perf_defconfig
          
          echo "Отключаем сломанные kprobes..."
          sed -i 's/CONFIG_KPROBES=y/# CONFIG_KPROBES is not set/g' arch/arm64/configs/lavender-perf_defconfig
          sed -i 's/CONFIG_HAVE_KPROBES=y/# CONFIG_HAVE_KPROBES is not set/g' arch/arm64/configs/lavender-perf_defconfig

      - name: Compile Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          DEFCONFIG="lavender-perf_defconfig"
          COMPILER_STRING="clang -no-integrated-as -B /usr/bin/aarch64-linux-gnu- -fno-builtin-stpcpy"

          # Генерация .config
          make O=out ARCH=arm64 CC="$COMPILER_STRING" $DEFCONFIG

          # Сборка ядра (двойной запуск для обхода состояния гонки KernelSU)
          make -j$(nproc --all) O=out ARCH=arm64 CC="$COMPILER_STRING" \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LD=aarch64-linux-gnu-ld \
               HOSTCFLAGS="-fcommon" || \
          make -j$(nproc --all) O=out ARCH=arm64 CC="$COMPILER_STRING" \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LD=aarch64-linux-gnu-ld \
               HOSTCFLAGS="-fcommon"
               
      - name: Package Kernel with AnyKernel3
        run: |
          # Скачиваем официальный AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Копируем собранное ядро
          cp out/arch/arm64/boot/Image.gz-dtb AK3/
          
          cd AK3
          # Автоматически редактируем anykernel.sh под твое устройство (lavender)
          sed -i 's/device.name1=maguro/device.name1=lavender/' anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot/block=auto/' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/' anykernel.sh
          
          # Удаляем лишнее и пакуем в ZIP
          rm -rf .git README.md
          zip -r9 ../Lavender-Custom-Kernel.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lavender-Flashable-Kernel
          path: Lavender-Custom-Kernel.zip
