name: Compile Kernel CI

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в интерфейсе GitHub

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev curl zip unzip

      - name: Download Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain
          
          # Подменяем дефолтный линкер на классический GNU ld, чтобы ядро 4.4 собиралось корректно
          cd toolchain/bin
          rm -f ld
          ln -s /usr/bin/aarch64-linux-gnu-ld ld

      - name: Compile Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          DEFCONFIG="lavender-perf_defconfig"
          COMPILER_STRING="clang -no-integrated-as -B /usr/bin/aarch64-linux-gnu-"

          # Генерация .config
          make O=out ARCH=arm64 CC="$COMPILER_STRING" $DEFCONFIG

          # Сборка ядра
          make -j$(nproc --all) O=out ARCH=arm64 CC="$COMPILER_STRING" \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LD=aarch64-linux-gnu-ld \
               HOSTCFLAGS="-fcommon"
               
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Kernel
          # Путь к итоговому файлу зависит от устройства (обычно Image.gz-dtb или Image)
          path: out/arch/arm64/boot/Image.gz-dtb
