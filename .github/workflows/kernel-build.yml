name: Compile Kernel CI

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в интерфейсе GitHub

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev curl zip unzip

      - name: Download Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

    - name: Setup KernelSU Next
        run: |
          echo "Скачиваем KernelSU Next..."
          curl -lsfas https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh | bash -
          
          echo "Принудительно интегрируем KSU в систему сборки..."
          echo "obj-y += kernelsu/" >> drivers/Makefile
          sed -i 's/obj-$(CONFIG_KSU)/obj-y/' drivers/kernelsu/Makefile
          
          echo "Бронебойные фиксы для старого ядра 4.4..."
          
          # 1. Решаем проблемы с путями и удаляем несуществующие заголовки
          find drivers/kernelsu/ -type f -name "*.[ch]" -exec sed -i 's/linux\/compiler_types\.h/linux\/compiler\.h/g' {} +
          find drivers/kernelsu/ -type f -name "*.[ch]" -exec sed -i 's/linux\/pgtable\.h/asm\/pgtable\.h/g' {} +
          find drivers/kernelsu/ -type f -name "*.[ch]" -exec sed -i '/linux\/sched\/task_stack\.h/d' {} +
          
          # 2. Вырезаем несовместимый lsm_hook.c (в ядре 4.4 нет современных хуков LSM)
          echo "void ksu_lsm_hook_init(void) {}" > drivers/kernelsu/hook/lsm_hook.c
          
          # 3. Создаем файл-прослойку (Compat Header)
          cat << 'EOF' > drivers/kernelsu/ksu_44_compat.h
          #ifndef KSU_44_COMPAT_H
          #define KSU_44_COMPAT_H
          #include <linux/init.h>
          #include <linux/sched.h>
          #include <linux/syscalls.h>
          #include <linux/ptrace.h>
          #include <linux/linkage.h>
          #include <linux/uaccess.h>
          
          /* Блокируем кривой fallback KSU и даем правильный тип указателя на функцию */
          typedef asmlinkage long (*ksu_real_syscall_fn_t)(struct pt_regs *regs);
          #define syscall_fn_t ksu_real_syscall_fn_t
          
          /* Переводим новые функции на старые аналоги ядра 4.4 */
          #define strncpy_from_user_nofault strncpy_from_user
          #define ksys_close sys_close
          #endif
          EOF
          
          # 4. Принудительно подключаем compat header ко всем файлам через Makefile
          echo "ccflags-y += -include \$(srctree)/drivers/kernelsu/ksu_44_compat.h" >> drivers/kernelsu/Makefile
          
          echo "Добавляем обязательные флаги для работы KPROBES..."
          cat <<EOF >> arch/arm64/configs/lavender-perf_defconfig
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_MODULES=y
          EOF
      
      - name: Compile Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          DEFCONFIG="lavender-perf_defconfig"
          COMPILER_STRING="clang -no-integrated-as -B /usr/bin/aarch64-linux-gnu- -fno-builtin-stpcpy"

          # Генерация .config
          make O=out ARCH=arm64 CC="$COMPILER_STRING" $DEFCONFIG

          # Сборка ядра
          make -j$(nproc --all) O=out ARCH=arm64 CC="$COMPILER_STRING" \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LD=aarch64-linux-gnu-ld \
               HOSTCFLAGS="-fcommon"
               
      # ... (здесь твой шаг Compile Kernel) ...

      - name: Package Kernel with AnyKernel3
        run: |
          # Скачиваем официальный AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Копируем собранное ядро
          cp out/arch/arm64/boot/Image.gz-dtb AK3/
          
          cd AK3
          # Автоматически редактируем anykernel.sh под твое устройство (lavender)
          sed -i 's/device.name1=maguro/device.name1=lavender/' anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot/block=auto/' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/' anykernel.sh
          
          # Удаляем лишнее и пакуем в ZIP
          rm -rf .git README.md
          zip -r9 ../Lavender-Custom-Kernel.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lavender-Flashable-Kernel
          path: Lavender-Custom-Kernel.zip
